name: Configure DarkOffice Domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain proxy tới DarkOffice hiện tại"
        required: false
        default: work.haivan.one
        type: string

permissions:
  contents: read

jobs:
  configure:
    name: Configure Existing Server Only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          SSH_PORT="${SERVER_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/darkoffice_key
          chmod 600 ~/.ssh/darkoffice_key
          ssh-keyscan -p "$SSH_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Configure Plane Caddy route without deploying code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PUBLIC_DOMAIN: ${{ inputs.domain }}
        run: |
          SSH_PORT="${SERVER_SSH_PORT:-22}"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTS="-i ~/.ssh/darkoffice_key -p ${SSH_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          SCP_OPTS="-i ~/.ssh/darkoffice_key -P ${SSH_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          case "$PUBLIC_DOMAIN" in *[!A-Za-z0-9.-]*|'') echo 'domain must be a hostname' >&2; exit 1;; esac
          scp $SCP_OPTS docker/plane/Caddyfile "$SSH_TARGET:/opt/plane/Caddyfile"
          ssh $SSH_OPTS "$SSH_TARGET" "PUBLIC_DOMAIN='$PUBLIC_DOMAIN' bash -s" <<'REMOTE'
          set -eu
          cd /opt/plane
          test -f docker-compose.plane.yml
          test -f Caddyfile
          test -f .env
          grep -q 'DARKOFFICE_DOMAIN' Caddyfile

          if grep -q '^DARKOFFICE_DOMAIN=' .env; then
            sed -i "s/^DARKOFFICE_DOMAIN=.*/DARKOFFICE_DOMAIN=${PUBLIC_DOMAIN}/" .env
          else
            printf 'DARKOFFICE_DOMAIN=%s\n' "$PUBLIC_DOMAIN" >> .env
          fi

          if docker compose version >/dev/null 2>&1; then
            COMPOSE='docker compose'
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE='docker-compose'
          else
            echo 'Docker Compose is required to update the Plane Caddy route.' >&2
            exit 1
          fi

          $COMPOSE --env-file .env -f docker-compose.plane.yml up -d proxy
          for attempt in $(seq 1 45); do
            if curl -fsS --resolve "${PUBLIC_DOMAIN}:443:127.0.0.1" "https://${PUBLIC_DOMAIN}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          $COMPOSE --env-file .env -f docker-compose.plane.yml logs --tail=100 proxy
          exit 1
          REMOTE

      - name: Verify public domain
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          PUBLIC_DOMAIN: ${{ inputs.domain }}
        run: |
          curl --fail --resolve "${PUBLIC_DOMAIN}:80:${SERVER_HOST}" "http://${PUBLIC_DOMAIN}/api/health"
