name: Configure DarkOffice Domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain proxy tới DarkOffice hiện tại"
        required: false
        default: work.haivan.one
        type: string

permissions:
  contents: read

jobs:
  configure:
    name: Configure Existing Server Only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          SSH_PORT="${SERVER_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/darkoffice_key
          chmod 600 ~/.ssh/darkoffice_key
          ssh-keyscan -p "$SSH_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Configure reverse proxy without deploying code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PUBLIC_DOMAIN: ${{ inputs.domain }}
        run: |
          SSH_PORT="${SERVER_SSH_PORT:-22}"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTS="-i ~/.ssh/darkoffice_key -p ${SSH_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          case "$PUBLIC_DOMAIN" in *[!A-Za-z0-9.-]*|'') echo 'domain must be a hostname' >&2; exit 1;; esac
          ssh $SSH_OPTS "$SSH_TARGET" "PUBLIC_DOMAIN='$PUBLIC_DOMAIN' bash -s" <<'REMOTE'
          set -eu
          curl -fsS http://127.0.0.1:5080/api/health >/dev/null
          command -v nginx >/dev/null
          sudo -n true >/dev/null 2>&1
          sudo install -d -m 755 /etc/nginx/sites-available /etc/nginx/sites-enabled
          sudo tee "/etc/nginx/sites-available/darkoffice-${PUBLIC_DOMAIN}" >/dev/null <<NGINX
          server {
              listen 80;
              server_name ${PUBLIC_DOMAIN};
              location / {
                  proxy_pass http://127.0.0.1:5080;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
NGINX
          sudo ln -sfn "/etc/nginx/sites-available/darkoffice-${PUBLIC_DOMAIN}" "/etc/nginx/sites-enabled/darkoffice-${PUBLIC_DOMAIN}"
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Verify public domain
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          PUBLIC_DOMAIN: ${{ inputs.domain }}
        run: |
          curl --fail --resolve "${PUBLIC_DOMAIN}:80:${SERVER_HOST}" "http://${PUBLIC_DOMAIN}/api/health"
