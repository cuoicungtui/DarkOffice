name: Initialize Strategy Delivery Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkoffice-strategy-delivery-initialization
  cancel-in-progress: false

env:
  DARKOFFICE_SERVER_ROOT: /opt/darkoffice

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/darkoffice_key
          chmod 600 ~/.ssh/darkoffice_key
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify Plane, install skill, and reconcile projections
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          SSH_OPTS=(-i ~/.ssh/darkoffice_key -p "${SERVER_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes)
          SCRIPT_B64=''
          # The remote script reads the existing container environment and never prints secrets.
          ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "printf '%s' '$SCRIPT_B64' | base64 -d | bash"
