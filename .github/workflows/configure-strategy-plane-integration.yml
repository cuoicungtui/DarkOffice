name: Configure Strategy Plane Integration

on:
  workflow_dispatch:
    inputs:
      project_title:
        description: Existing Plane project used for the integration objective
        required: true
        default: DarkOffice Execution
        type: string

permissions:
  contents: read

concurrency:
  group: darkoffice-strategy-plane-configuration
  cancel-in-progress: false

env:
  DARKOFFICE_SERVER_ROOT: /opt/darkoffice

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/darkoffice_key
          chmod 600 ~/.ssh/darkoffice_key
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Create the operational strategy branch and Plane work
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          set -eu
          SSH_OPTS=(-i ~/.ssh/darkoffice_key -p "${SERVER_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes)
          SCRIPT_B64=''
          # shellcheck disable=SC2029
          ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "
            set -eu
            cd '${DARKOFFICE_SERVER_ROOT}'
            docker exec -w /a0 -e PROJECT_TITLE='${PROJECT_TITLE}' darkoffice python3 -c \"\$(printf '%s' '$SCRIPT_B64' | base64 -d)\"
          "
