name: Repair Plane Admin Email

on:
  workflow_dispatch:
    inputs:
      from_email:
        description: Existing Plane account email
        required: true
        type: string
      to_email:
        description: Replacement Plane account email
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plane-admin-email-repair
  cancel-in-progress: false

env:
  PLANE_SERVER_ROOT: /opt/plane

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate email inputs
        env:
          FROM_EMAIL: ${{ inputs.from_email }}
          TO_EMAIL: ${{ inputs.to_email }}
        run: |
          [[ "$FROM_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]
          [[ "$TO_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]
          test "$FROM_EMAIL" != "$TO_EMAIL"

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/darkoffice_key
          chmod 600 ~/.ssh/darkoffice_key
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Rename the existing Plane admin account
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          FROM_EMAIL: ${{ inputs.from_email }}
          TO_EMAIL: ${{ inputs.to_email }}
        run: |
          set -eu
          SSH_OPTS=(-i ~/.ssh/darkoffice_key -p "${SERVER_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes)
          # shellcheck disable=SC2029
          ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "
            set -eu
            cd '/opt/plane'
            if docker compose version >/dev/null 2>&1; then COMPOSE='docker compose'; else COMPOSE='docker-compose'; fi
            \$COMPOSE --env-file .env -f docker-compose.plane.yml exec -T -e FROM_EMAIL='${FROM_EMAIL}' -e TO_EMAIL='${TO_EMAIL}' api python manage.py shell -c \"from plane.db.models import User; import os; old=os.environ['FROM_EMAIL']; new=os.environ['TO_EMAIL']; user=User.objects.get(email__iexact=old); assert not User.objects.exclude(pk=user.pk).filter(email__iexact=new).exists(), 'The replacement email already belongs to another user'; user.email=new; user.save(update_fields=['email','updated_at']); print('Plane admin email updated')\"
          "
