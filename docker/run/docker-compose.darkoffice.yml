services:
  darkoffice:
    container_name: ${DARKOFFICE_CONTAINER_NAME:-darkoffice}
    image: ${DARKOFFICE_BASE_IMAGE:-agent0ai/agent-zero:latest}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${DARKOFFICE_SOURCE_DIR:-../..}:/a0
      - ${DARKOFFICE_DATA_DIR:-../../usr}:/a0/usr
    ports:
      - "${DARKOFFICE_HTTP_PORT:-5080}:80"
    environment:
      BRANCH: ${BRANCH:-local}
      A0_NOFILE_LIMIT: ${A0_NOFILE_LIMIT:-65535}
      A0_SELF_UPDATE_HEALTH_TIMEOUT_SECONDS: ${A0_SELF_UPDATE_HEALTH_TIMEOUT_SECONDS:-180}
      AUTH_LOGIN: ${AUTH_LOGIN:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      PLANE_API_BASE_URL: ${PLANE_API_BASE_URL:-}
      PLANE_PUBLIC_BASE_URL: ${PLANE_PUBLIC_BASE_URL:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WEBHOOK_SECRET: ${PLANE_WEBHOOK_SECRET:-}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      plane-integration:
        aliases:
          - darkoffice

networks:
  plane-integration:
    name: ${PLANE_DARKOFFICE_NETWORK:-plane-integration}
    external: true
